<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>KUSUM ERP</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    body { display: grid; place-items: center; color: #fff; font-family: Arial, Helvetica, sans-serif; }
    .splash { display: grid; place-items: center; text-align: center; width: 100%; height: 100%; }
    .lockup { transform: translateY(8px); animation: lockup-in 900ms cubic-bezier(.2,.8,.2,1) 120ms both; }
    .wordmark { display: flex; justify-content: center; gap: .025em; font-size: clamp(64px, 12vw, 164px); font-weight: 800; letter-spacing: -.08em; line-height: .82; }
    .glyph { display: inline-block; opacity: 0; transform: translateY(26px) scale(.9); animation: glyph-in 650ms cubic-bezier(.2,.8,.2,1) calc(260ms + var(--delay)) both; }
    .erp { margin-top: 24px; font-size: clamp(16px, 2.6vw, 34px); font-weight: 700; letter-spacing: .62em; text-indent: .62em; opacity: 0; animation: erp-in 700ms ease-out 930ms both; }
    .rule { width: min(290px, 45vw); height: 1px; margin: 22px auto 0; background: #fff; opacity: 0; transform: scaleX(.2); animation: rule-in 700ms ease-out 1.02s both; }
    @keyframes lockup-in { from { opacity: 0; transform: translateY(22px) scale(.97); } to { opacity: 1; transform: translateY(8px) scale(1); } }
    @keyframes glyph-in { from { opacity: 0; transform: translateY(26px) scale(.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes erp-in { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes rule-in { from { opacity: 0; transform: scaleX(.2); } to { opacity: .6; transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .lockup, .glyph, .erp, .rule { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <main class="splash" aria-label="KUSUM ERP">
    <section class="lockup">
      <div class="wordmark" aria-label="KUSUM">
        <span class="glyph" style="--delay:0ms">K</span>
        <span class="glyph" style="--delay:80ms">U</span>
        <span class="glyph" style="--delay:160ms">S</span>
        <span class="glyph" style="--delay:240ms">U</span>
        <span class="glyph" style="--delay:320ms">M</span>
      </div>
      <div class="erp">ERP</div>
      <div class="rule" aria-hidden="true"></div>
    </section>
  </main>
</body>
</html>
